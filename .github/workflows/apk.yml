name: Aplikacja Android (APK)

# Uruchamia się po wypchnięciu znacznika wersji, np. v1.0.0 (git tag v1.0.0 && git push origin v1.0.0),
# albo ręcznie z zakładki Actions. Wynik: plik Shelfie.apk w wydaniu (Releases) i jako artefakt przebiegu.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Bez BASE_PATH: w aplikacji strona leży w katalogu głównym.
      - run: npm run build
      - run: npx cap add android
      - name: Dopasuj projekt Android (uprawnienia, ikona, wersja)
        run: node scripts/android-prepare.mjs
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
          APP_VERSION_CODE: ${{ github.run_number }}
      - run: npx cap sync android
      - name: Zbuduj APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Nazwij plik
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Shelfie.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Shelfie-apk
          path: Shelfie.apk
      - name: Opublikuj w wydaniu
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Shelfie.apk
          name: Shelfie ${{ github.ref_name }}
          body: Aplikacja na Androida. Pobierz plik Shelfie.apk na telefon i zainstaluj (Android poprosi o zezwolenie na instalację z tego źródła).
