name: Aplikacja Android (APK)

# Uruchamia się po wypchnięciu znacznika wersji, np. v1.0.0 (git tag v1.0.0 && git push origin v1.0.0),
# albo ręcznie z zakładki Actions. Wynik: plik Shelfie.apk w wydaniu (Releases) i jako artefakt przebiegu.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Bez BASE_PATH: w aplikacji strona leży w katalogu głównym.
      - run: npm run build
      - run: npx cap add android
      - name: Dopasuj projekt Android (uprawnienia, ikona, wersja)
        run: node scripts/android-prepare.mjs
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
          APP_VERSION_CODE: ${{ github.run_number }}
          SHELFIE_SIGN: ${{ secrets.SHELFIE_KEYSTORE_B64 != '' && '1' || '' }}
      - run: npx cap sync android
      # Stały klucz podpisu: dzięki niemu nowa wersja instaluje się NA starą (z zachowaniem danych w telefonie).
      # Klucz leży w sekretach repozytorium (SHELFIE_KEYSTORE_B64), a nie w kodzie. Bez sekretu build dostaje losowy
      # klucz i trzeba odinstalować starą aplikację przed instalacją.
      - name: Ustaw stały klucz podpisu
        env:
          KEYSTORE_B64: ${{ secrets.SHELFIE_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Stały klucz podpisu ustawiony."
            INFO=$(keytool -list -keystore ~/.android/debug.keystore -storepass android 2>&1 | tr -s '\n' ' ' | cut -c1-400)
            echo "::notice::keystore: $INFO"
          else
            echo "::warning::Brak sekretu SHELFIE_KEYSTORE_B64: APK dostanie losowy klucz i nie zainstaluje się na starej wersji."
          fi
      - name: Zbuduj APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Nazwij plik
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Shelfie.apk
          echo "Odcisk podpisu (musi być taki sam w każdej wersji):"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs Shelfie.apk | grep -E "SHA-256|DN" || true
      - uses: actions/upload-artifact@v4
        with:
          name: Shelfie-apk
          path: Shelfie.apk
      - name: Opublikuj w wydaniu
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Shelfie.apk
          name: Shelfie ${{ github.ref_name }}
          body: Aplikacja na Androida. Pobierz plik Shelfie.apk na telefon i zainstaluj (Android poprosi o zezwolenie na instalację z tego źródła).
