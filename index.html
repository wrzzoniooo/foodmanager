<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6EDE3" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* Motyw ustawiamy zanim pojawi się strona, żeby nie było błysku jasnego tła. */
      try {
        var t = localStorage.getItem('spizarnia.theme.v1');
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : 'auto';
      } catch (e) {
        document.documentElement.dataset.theme = 'auto';
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spiżarnia" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Spiżarnia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
